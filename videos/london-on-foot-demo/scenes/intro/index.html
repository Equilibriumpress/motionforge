<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<style>html,body{margin:0;background:#0d1822}canvas{width:100%;height:100%;display:block}</style>
</head><body><canvas id="stage" width="1920" height="1080"></canvas>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

window.DUR = 8;
window.SIZE = [W, H];
window.TEXTS = (t) => t < 1.6 ? [] : [
  { id:'title', text:'LONDON ON FOOT', x0:115, y0:370, x1:1540, y1:720 },
  { id:'subtitle', text:'WALKING THE CITY', x0:120, y0:850, x1:900, y1:910 }
];
window.render = (t) => {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1822';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.strokeStyle = '#b6e2b7';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.setLineDash([18, 26]);
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.moveTo(130, 780);
  ctx.bezierCurveTo(420, 500, 520, 920, 810, 640);
  ctx.bezierCurveTo(1010, 390, 1250, 630, 1760, 290);
  const progress = ease(t / 4.2);
  // A deterministic dash offset gives identical output for identical time.
  ctx.setLineDash([1600, 1600]);
  ctx.lineDashOffset = 1600 * (1 - progress);
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = ease((t - 1.3) / 1.3);
  ctx.fillStyle = '#f5f1e8';
  ctx.font = '800 188px system-ui,sans-serif';
  ctx.fillText('LONDON', 110, 515);
  ctx.fillText('ON FOOT', 110, 710);
  ctx.fillStyle = '#b6e2b7';
  ctx.font = '600 42px system-ui,sans-serif';
  ctx.fillText('WALKING THE CITY', 120, 884);
  ctx.globalAlpha = 1;
};
window.render(0);
window.READY = true;
</script></body></html>
