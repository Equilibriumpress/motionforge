<!doctype html>
<!--
  motionforge template: checklist-reveal — a title, then items that slide in one by one and get a drawn check mark
  © 2026 motionforge contributors, MIT
  Sync each item to the word that names it: set "times" to the voiceover seconds (scene-local), or use start + gap.
-->
<html lang="nl" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #title { top: 330px; font-size: 88px; }
      #list { position: absolute; left: 90px; right: 90px; top: 620px; }
      .item { display: flex; align-items: center; gap: 30px; padding: 30px 34px; margin-bottom: 24px; border-radius: 30px; background: var(--mf-card); border: 2px solid var(--mf-line); }
      .box { flex: none; width: 74px; height: 74px; border-radius: 20px; border: 4px solid var(--mf-line); position: relative; }
      .box svg { position: absolute; inset: -4px; width: 74px; height: 74px; }
      .box path { fill: none; stroke: var(--mf-accent-ink); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .fill { position: absolute; inset: -4px; border-radius: 20px; background: var(--mf-accent); transform: scale(0); }
      .label { font: 700 50px/1.2 var(--mf-font-display); letter-spacing: -0.02em; }
      .num { font: 500 28px var(--mf-font-mono); color: var(--mf-muted); margin-left: auto; }
    </style>
  <style id="route-journey-landscape">
    :root { --mf-w:1920px; --mf-h:1080px; --mf-bg:#EEEBE3; --mf-bg-light:#EEEBE3;
      --mf-accent:#E23D6F; --mf-accent-ink:#fff; --mf-card:#fffdf7;
      --mf-line:#C8D5CE; --mf-text:#1E2B2F; --mf-text-dark:#1E2B2F; --mf-muted:#627774;
      --mf-font-display:Outfit,Arial,sans-serif;--mf-font-body:Outfit,Arial,sans-serif;
      --mf-font-accent:Georgia,serif; --mf-font-mono:"Courier New",monospace;--mf-grain-opacity:.035;}
    html,body,#root {width:1920px;height:1080px;}
    #root.mf-stage {background:#EEEBE3;color:#1E2B2F}
    /* Scene-specific 16:9 layout derived from the original HyperFrames source. */
  </style>
<style id="peak-route-layout">
#title {position:absolute;left:75px;right:auto;top:115px;width:590px;font-size:67px;
  line-height:1.06;text-align:left;letter-spacing:-.035em;color:#1E2B2F}
#list {position:absolute;left:75px;right:auto;top:335px;width:575px}
.item {display:flex;gap:20px;margin-bottom:16px;padding:15px 19px;border-radius:17px;
  background:#fff;border:1px solid #d5ddd3;box-shadow:0 12px 30px rgba(20,47,44,.07)}
.box{width:54px;height:54px;border-radius:14px; border-width:3px}
.box svg{width:54px;height:54px;inset:-3px}
.box path{stroke-width:9}
.fill{border-radius:13px}
.label{font-size:33px;font-weight:700;line-height:1.3}
.num{font-size:22px;margin-left:auto}
#route-overview{position:absolute;left:690px;top:114px;width:1160px;height:860px;
  border:8px solid #fff;border-radius:24px;box-shadow:0 25px 70px rgba(31,63,58,.16);
  overflow:hidden;pointer-events:none}
#map-notice {position:absolute;right:110px;bottom:65px;color:#39514b;
  font:600 22px/1.4 "Courier New",monospace;text-align:right;z-index:2}
#route-kicker {position:absolute;top:70px;left:75px;color:#E23D6F;font:700 25px "Courier New",monospace;
  letter-spacing:.18em}
</style></head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="route-kicker">PEAK DISTRICT / VIER HALTES</div>
      <svg id="route-overview" xmlns="http://www.w3.org/2000/svg" width="1160" height="860" viewBox="720 100 1160 860" aria-label="Geografische haltepunten, verbindingen schematisch">
<rect width="1920" height="1080" fill="#e6eadd"/>
<path d="M765 790 Q970 630 1080 780T1510 760T1950 430" fill="none" stroke="#CFDCC0" stroke-width="120" opacity=".55"/>
<path d="M790 250 Q920 110 1150 250 T1760 215" fill="none" stroke="#CFDCC0" stroke-width="85" opacity=".4"/>
<path d="M1530 110 Q1680 310 1660 485 T1850 820" fill="none" stroke="#AECBD8" stroke-width="28" opacity=".72"/>
<g fill="none" stroke="#fff" stroke-width="2" opacity=".85"><path d="M780 360 Q1040 465 1750 310"/><path d="M850 690 Q1190 560 1720 665"/></g>
<path id="route-base" d="M1077 367 L964 351 L1259 254 L1424 664" fill="none" stroke="#fff" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
<path id="route-animated" d="M1077 367 L964 351 L1259 254 L1424 664" fill="none" stroke="#E23D6F" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
<g id="route-stop-0" class="route-stop" opacity="0" transform="translate(1077 367)">
<circle class="route-stop-circle" r="27" fill="#E23D6F" stroke="white" stroke-width="6"/>
<text x="0" y="8" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">1</text>
</g>
<g id="route-stop-1" class="route-stop" opacity="0" transform="translate(964 351)">
<circle class="route-stop-circle" r="27" fill="#E23D6F" stroke="white" stroke-width="6"/>
<text x="0" y="8" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">2</text>
</g>
<g id="route-stop-2" class="route-stop" opacity="0" transform="translate(1259 254)">
<circle class="route-stop-circle" r="27" fill="#E23D6F" stroke="white" stroke-width="6"/>
<text x="0" y="8" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">3</text>
</g>
<g id="route-stop-3" class="route-stop" opacity="0" transform="translate(1424 664)">
<circle class="route-stop-circle" r="27" fill="#E23D6F" stroke="white" stroke-width="6"/>
<text x="0" y="8" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">4</text>
</g>
<g id="route-car" opacity="0" fill="#1E2B2F" transform="translate(1077 367)">
<rect x="-20" y="-46" width="40" height="25" rx="8"/>
<circle cx="-10" cy="-20" r="5" fill="#fff"/><circle cx="10" cy="-20" r="5" fill="#fff"/>
</g>
</svg>
      <div id="map-notice">LIGGING HALTES · VERBINDINGEN SCHEMATISCH<br/>GEEN WEGENKAART / GEEN ROUTEBEREKENING</div>
      <h1 id="title" class="title clip" data-start="0" data-duration="10" data-track-index="0"></h1>
      <div id="list" class="clip" data-start="0" data-duration="10" data-track-index="1"></div>
    </div>

    <script id="params" type="application/json">
{
  "title": "Vier haltes, één <span class=\"serif accent\">roadtrip</span>",
  "items": [
    "Castleton",
    "Mam Tor",
    "Ladybower",
    "Bakewell"
  ],
  "times": [
    1,
    2.9,
    4.8,
    6.7
  ],
  "start": 1,
  "gap": 1.9,
  "checkDelay": 0.4,
  "numbered": true,
  "theme": "light",
  "lang": "nl",
  "duration": 10
}
    </script>

    <script>
      const P = MF.params();
      document.documentElement.lang = P.lang;
      if (P.theme === "light") document.getElementById("root").classList.add("light");
      document.getElementById("title").innerHTML = P.title || "";

      const list = document.getElementById("list");
      const rows = P.items.map((text, i) => {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = '<div class="box"><div class="fill"></div><svg viewBox="0 0 74 74"><path d="M20 38 L32 50 L55 25" /></svg></div><div class="label"></div>' +
          (P.numbered ? `<div class="num">${String(i + 1).padStart(2, "0")}</div>` : "");
        row.querySelector(".label").textContent = text;
        list.appendChild(row);
        return row;
      });

      const tl = MF.timeline("main", P.duration);
      tl.fromTo("#title", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.6)" }, 0.15);
      rows.forEach((row, i) => {
        const at = P.times && P.times[i] != null ? P.times[i] : P.start + i * P.gap;
        const path = row.querySelector("path");
        const length = 60; // the check path is about 55 units long
        path.style.strokeDasharray = length;
        tl.fromTo(row, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at);
        tl.fromTo(row.querySelector(".fill"), { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.2)" }, at + P.checkDelay);
        tl.fromTo(path, { strokeDashoffset: length }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at + P.checkDelay + 0.08);
        tl.to(row.querySelector(".box"), { borderColor: "transparent", duration: 0.1 }, at + P.checkDelay);
      });

      // MF Route Journey 16:9 adaptation: original checklist timeline also seeks the geo-overview.
      // Locations are approximate WGS84 points; the connecting line is NOT a road geometry.
      const road=document.getElementById("route-animated");
      const vehicle=document.getElementById("route-car");
      const total=road.getTotalLength();
      gsap.set(road,{strokeDasharray:total,strokeDashoffset:total});
      tl.to(road,{strokeDashoffset:0,duration:8.1,ease:"none"},1.0);
      const position={distance:0};
      tl.to(position,{distance:total,duration:8.1,ease:"none",onUpdate:()=>{
        const p=road.getPointAtLength(position.distance);
        vehicle.setAttribute("transform","translate("+p.x+" "+p.y+")");
      }},1.0);
      tl.fromTo(vehicle,{opacity:0},{opacity:1,duration:.25},1.0);
      tl.fromTo("#route-stop-0",{opacity:0,scale:.55,transformOrigin:"center center"},
        {opacity:1,scale:1,duration:.35,ease:"back.out(1.8)"},1);
      tl.fromTo("#route-stop-1",{opacity:0,scale:.55,transformOrigin:"center center"},
        {opacity:1,scale:1,duration:.35,ease:"back.out(1.8)"},2.9);
      tl.fromTo("#route-stop-2",{opacity:0,scale:.55,transformOrigin:"center center"},
        {opacity:1,scale:1,duration:.35,ease:"back.out(1.8)"},4.8);
      tl.fromTo("#route-stop-3",{opacity:0,scale:.55,transformOrigin:"center center"},
        {opacity:1,scale:1,duration:.35,ease:"back.out(1.8)"},6.7);

      MF.ready();
      tl.seek(0);
    </script>
  </body>
</html>
