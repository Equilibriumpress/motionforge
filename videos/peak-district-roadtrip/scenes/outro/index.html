<!doctype html>
<!--
  motionforge template: kinetic-title — a 1–3 line headline that builds word by word
  © 2026 motionforge contributors, MIT
  Edit the values in <script id="params">; the schema and defaults are in params.json.
  Scaffold: engines/hyperframes/scripts/new-scene.sh my-title --template kinetic-title
-->
<html lang="nl" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #eyebrow { top: 740px; }
      #headline { position: absolute; left: 70px; right: 70px; top: 820px; text-align: center; }
      .line { display: block; font: 800 120px/1.04 var(--mf-font-display); letter-spacing: -0.04em; }
      .word { display: inline-block; margin: 0 0.12em; will-change: transform, opacity, filter; }
      .word.accent-word { font-family: var(--mf-font-accent); font-style: italic; font-weight: 400; letter-spacing: -0.01em; color: var(--mf-accent); padding-right: 0.05em; }
      #underline { position: absolute; left: 50%; width: 0; height: 12px; margin-left: 0; border-radius: 6px; background: var(--mf-accent); }
    </style>
  <style id="route-journey-landscape">
    :root { --mf-w:1920px; --mf-h:1080px; --mf-bg:#EEEBE3; --mf-bg-light:#EEEBE3;
      --mf-accent:#E23D6F; --mf-accent-ink:#fff; --mf-card:#fffdf7;
      --mf-line:#C8D5CE; --mf-text:#1E2B2F; --mf-text-dark:#1E2B2F; --mf-muted:#627774;
      --mf-font-display:Outfit,Arial,sans-serif;--mf-font-body:Outfit,Arial,sans-serif;
      --mf-font-accent:Georgia,serif; --mf-font-mono:"Courier New",monospace;--mf-grain-opacity:.035;}
    html,body,#root {width:1920px;height:1080px;}
    #root.mf-stage {background:#EEEBE3;color:#1E2B2F}
    /* Scene-specific 16:9 layout derived from the original HyperFrames source. */
  </style><style id="peak-outro-layout">
  #root.mf-stage{background:#15272B!important;color:#fffdf7}
  #headline{left:100px;right:100px;top:365px;text-align:center}
  #eyebrow{top:245px;font-size:24px;letter-spacing:.08em;color:#FFC1D2}
  .line{font-size:112px!important;line-height:1.10}
  #underline{height:11px;background:#E23D6F}
  .trip-band{position:absolute;bottom:145px;left:160px;right:160px;
    display:flex;justify-content:center;gap:26px;border-top:1px solid #758780;padding-top:22px;
    font:600 22px "Courier New",monospace;letter-spacing:.07em;color:#e4ebe3}
  </style></head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="trip-band"><span>4 HALTES</span><span>1 ROADTRIP</span><span>30 SECONDEN</span></div><div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <h1 id="headline" class="clip" data-start="0" data-duration="5" data-track-index="1"></h1>
      <div id="underline" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    </div>

    <script id="params" type="application/json">
{
  "lines": [
    "JOUW VOLGENDE",
    "ROADTRIP?"
  ],
  "accentWord": "ROADTRIP",
  "eyebrow": "CASTLETON · MAM TOR · LADYBOWER · BAKEWELL",
  "theme": "dark",
  "lang": "nl",
  "fontSize": 110,
  "start": 0.22,
  "stagger": 0.13,
  "underline": true,
  "exit": false,
  "duration": 5
}
    </script>

    <script>
      const P = MF.params();
      document.documentElement.lang = P.lang;
      if (P.theme === "light") document.getElementById("root").classList.add("light");

      // Build the words. The accent word is matched case-insensitively, punctuation ignored.
      const clean = (w) => w.toLocaleLowerCase(P.lang).replace(/[^\p{L}\p{N}]/gu, "");
      const headline = document.getElementById("headline");
      const words = [];
      P.lines.forEach((text) => {
        const line = document.createElement("span");
        line.className = "line";
        line.style.fontSize = P.fontSize + "px";
        text.split(/\s+/).filter(Boolean).forEach((w) => {
          const span = document.createElement("span");
          span.className = "word" + (P.accentWord && clean(w) === clean(P.accentWord) ? " accent-word" : "");
          span.textContent = w;
          line.appendChild(span);
          words.push(span);
        });
        headline.appendChild(line);
      });
      document.getElementById("eyebrow").textContent = P.eyebrow || "";

      const tl = MF.timeline("main", P.duration);
      if (P.eyebrow) tl.fromTo("#eyebrow", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, P.start);
      words.forEach((el, i) => {
        tl.fromTo(el,
          { opacity: 0, y: 60, scale: 0.8, filter: "blur(14px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.7)" },
          P.start + 0.1 + i * P.stagger);
      });
      const settled = P.start + 0.1 + words.length * P.stagger + 0.35;
      if (P.underline) {
        // sits under the last line; measured after fonts load (position only, the tween is width)
        const place = () => {
          const box = headline.getBoundingClientRect();
          gsap.set("#underline", { top: box.bottom + 18, x: -260 });
        };
        place();
        MF.ready().then(place);
        tl.fromTo("#underline", { width: 0 }, { width: 520, duration: 0.5, ease: "power3.out" }, settled);
      }
      if (P.exit) {
        tl.to([...words].reverse(), { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.25, stagger: 0.03, ease: "power2.in" }, P.duration - 0.45);
        tl.to(["#eyebrow", "#underline"], { opacity: 0, duration: 0.2 }, P.duration - 0.3);
      }
      MF.ready();
      tl.seek(0);
    </script>
  </body>
</html>
