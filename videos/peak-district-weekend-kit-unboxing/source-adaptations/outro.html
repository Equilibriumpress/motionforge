<!doctype html>
<!--
  motionforge template: kinetic-title — a 1–3 line headline that builds word by word
  © 2026 motionforge contributors, MIT
  Edit the values in <script id="params">; the schema and defaults are in params.json.
  Scaffold: engines/hyperframes/scripts/new-scene.sh my-title --template kinetic-title
-->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #eyebrow { top: 740px; }
      #headline { position: absolute; left: 70px; right: 70px; top: 820px; text-align: center; }
      .line { display: block; font: 800 120px/1.04 var(--mf-font-display); letter-spacing: -0.04em; }
      .word { display: inline-block; margin: 0 0.12em; will-change: transform, opacity, filter; }
      .word.accent-word { font-family: var(--mf-font-accent); font-style: italic; font-weight: 400; letter-spacing: -0.01em; color: var(--mf-accent); padding-right: 0.05em; }
      #underline { position: absolute; left: 50%; width: 0; height: 12px; margin-left: 0; border-radius: 6px; background: var(--mf-accent); }

:root {--mf-w:1920px;--mf-h:1080px;--mf-bg:#CDA77C;--mf-bg-light:#CDA77C;--mf-glow:#CDA77C;--mf-card:#FFFDF7;--mf-line:#8A6F52;--mf-text:#1E1A16;--mf-text-dark:#1E1A16;--mf-muted:#8A6F52;--mf-accent:#FF3E8A;--mf-accent-ink:#1E1A16;--mf-font-display:"Rubik",system-ui,sans-serif;--mf-font-body:"Rubik",system-ui,sans-serif;--mf-font-accent:"Rubik",system-ui,sans-serif;--mf-font-mono:"Rubik",system-ui,sans-serif}
html,body {width:1920px;height:1080px;background:#CDA77C}
#root.mf-stage,#root.mf-stage.light {width:1920px;height:1080px;color:#1E1A16;background:#CDA77C}
#root.mf-stage::after {background:radial-gradient(ellipse at 50% 50%,transparent 66%,rgba(70,45,24,.11) 100%)}
#root.mf-stage::before {opacity:.08;mix-blend-mode:multiply}
.serif,.accent,.accent-word {color:#FF3E8A;font:900 1em/1 "Rubik",system-ui,sans-serif;font-style:normal}
#eyebrow {left:1145px;right:90px;top:138px;text-align:left;color:#1E1A16;font:500 26px/1.25 "Rubik",system-ui,sans-serif;letter-spacing:.1em}

#headline {left:1100px;right:100px;top:275px;text-align:left;background:#FFFDF7;padding:50px 40px 50px;
 box-shadow:0 8px 0 rgba(0,0,0,.2);transform:rotate(-3deg);border:10px solid #FFFDF7;border-radius:15px}
.line {font:900 92px/1.06 "Rubik",system-ui,sans-serif;letter-spacing:-.02em}
.word.accent-word {font-family:"Rubik",system-ui,sans-serif!important;font-weight:900!important;font-style:normal!important}
#underline {display:none}
#box-drawing {position:absolute;left:240px;top:250px;width:635px;height:555px;transform:rotate(-4deg)}
#box-drawing .carton {position:absolute;left:55px;top:135px;width:540px;height:345px;background:#8A6F52;border:16px solid #AF855D;box-shadow:20px 24px 0 rgba(0,0,0,.15)}
#box-drawing .lid {position:absolute;left:4px;top:30px;width:625px;height:190px;background:#CDA77C;
 transform:skewY(-7deg);border:13px solid #AF855D;box-shadow:8px 12px 0 rgba(0,0,0,.14)}
#box-drawing .tape {position:absolute;left:280px;top:20px;width:60px;height:220px;background:#FF3E8A;opacity:.7;transform:skewY(-7deg)}
#box-drawing .stamp {position:absolute;left:142px;top:340px;background:#FFFDF7;padding:15px 18px;
 font:700 38px/1 "Rubik",system-ui,sans-serif;transform:rotate(-5deg);box-shadow:0 6px 0 rgba(0,0,0,.18)}

    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="box-drawing" class="clip" data-start="0" data-duration="5" data-track-index="3" aria-hidden="true"><div class="carton"></div><div class="lid"></div><div class="tape"></div><div class="stamp">WEEKEND KIT</div></div>
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <h1 id="headline" class="clip" data-start="0" data-duration="5" data-track-index="1"></h1>
      <div id="underline" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    </div>

    <script id="params" type="application/json">
{
  "lines": [
    "PEAK DISTRICT",
    "BEWAAR DIT IDEE"
  ],
  "accentWord": "IDEE",
  "eyebrow": "THE WEEKEND KIT · FICTIEF PRODUCT",
  "theme": "light",
  "lang": "nl",
  "fontSize": 84,
  "start": 0.27,
  "stagger": 0.1,
  "underline": false,
  "exit": false,
  "duration": 5
}
    </script>

    <script>
      const P = MF.params();
      document.documentElement.lang = P.lang;
      if (P.theme === "light") document.getElementById("root").classList.add("light");

      // Build the words. The accent word is matched case-insensitively, punctuation ignored.
      const clean = (w) => w.toLocaleLowerCase(P.lang).replace(/[^\p{L}\p{N}]/gu, "");
      const headline = document.getElementById("headline");
      const words = [];
      P.lines.forEach((text) => {
        const line = document.createElement("span");
        line.className = "line";
        line.style.fontSize = P.fontSize + "px";
        text.split(/\s+/).filter(Boolean).forEach((w) => {
          const span = document.createElement("span");
          span.className = "word" + (P.accentWord && clean(w) === clean(P.accentWord) ? " accent-word" : "");
          span.textContent = w;
          line.appendChild(span);
          words.push(span);
        });
        headline.appendChild(line);
      });
      document.getElementById("eyebrow").textContent = P.eyebrow || "";

      const tl = MF.timeline("main", P.duration);
      tl.fromTo("#box-drawing",{opacity:0,scale:.85},{opacity:1,scale:1,duration:.6,ease:"back.out(1.8)"},.14);
      if (P.eyebrow) tl.fromTo("#eyebrow", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, P.start);
      words.forEach((el, i) => {
        tl.fromTo(el,
          { opacity: 0, y: 60, scale: 0.8, filter: "blur(14px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.7)" },
          P.start + 0.1 + i * P.stagger);
      });
      const settled = P.start + 0.1 + words.length * P.stagger + 0.35;
      if (P.underline) {
        // sits under the last line; measured after fonts load (position only, the tween is width)
        const place = () => {
          const box = headline.getBoundingClientRect();
          gsap.set("#underline", { top: box.bottom + 18, x: -260 });
        };
        place();
        MF.ready().then(place);
        tl.fromTo("#underline", { width: 0 }, { width: 520, duration: 0.5, ease: "power3.out" }, settled);
      }
      if (P.exit) {
        tl.to([...words].reverse(), { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.25, stagger: 0.03, ease: "power2.in" }, P.duration - 0.45);
        tl.to(["#eyebrow", "#underline"], { opacity: 0, duration: 0.2 }, P.duration - 0.3);
      }
      MF.ready();
      tl.seek(0);
    </script>
  </body>
</html>
