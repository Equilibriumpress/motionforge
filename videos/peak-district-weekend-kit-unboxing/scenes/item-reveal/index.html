<!doctype html>
<!--
  motionforge template: product-turntable-3d — a product on a lit pedestal, slow camera orbit, spec callouts
  whose leader lines follow points on the 3D object
  © 2026 motionforge contributors, MIT
  3D layer: three.js (MIT, from npm) + mf-three.js, copied into assets/vendor/ by new-scene.sh.
  Contract: engines/hyperframes/three/README.md (hf-seek drives the 3D, GSAP drives the HTML text).
  Default product: an original speaker built from primitives. Set "model" to a local .glb to show yours.
-->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js", "three/addons/": "./assets/vendor/three-addons/" } }</script>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/mf-runtime.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      #pool { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: radial-gradient(520px 300px at 50% 1450px, rgba(255, 255, 255, 0.10), transparent 70%); }
      .light #pool { background: radial-gradient(560px 320px at 50% 1450px, rgba(255, 255, 255, 0.9), transparent 70%); }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #eyebrow { top: 230px; }
      #title { top: 290px; font-size: 96px; }
      #leaders { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      #leaders line { stroke: var(--mf-text); stroke-opacity: 0.55; stroke-width: 2; }
      .light #leaders line { stroke: var(--mf-text-dark); }
      #leaders .dot { fill: var(--mf-accent); }
      #leaders .halo { fill: none; stroke: var(--mf-accent); stroke-width: 2; }
      .callout { position: absolute; top: 0; width: 230px; opacity: 0; }
      .callout.left { left: 56px; text-align: left; }
      .callout.right { right: 56px; text-align: right; }
      .callout .v { font: 800 54px/1 var(--mf-font-display); letter-spacing: -0.03em; }
      .callout .d { margin-top: 10px; font: 500 23px/1.3 var(--mf-font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--mf-muted); }
      #subline { position: absolute; left: 80px; right: 80px; top: 1660px; text-align: center; font: 500 28px/1.3 var(--mf-font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mf-muted); }
      #subline b { color: var(--mf-accent); font-weight: 700; }
      .light #subline b { color: var(--mf-text-dark); }
      #grain { position: absolute; inset: 0; z-index: 5; pointer-events: none; background-image: var(--mf-grain); opacity: 0.05; mix-blend-mode: overlay; }

:root {--mf-w:1920px;--mf-h:1080px;--mf-bg:#CDA77C;--mf-bg-light:#CDA77C;--mf-glow:#CDA77C;--mf-card:#FFFDF7;--mf-line:#8A6F52;--mf-text:#1E1A16;--mf-text-dark:#1E1A16;--mf-muted:#8A6F52;--mf-accent:#FF3E8A;--mf-accent-ink:#1E1A16;--mf-font-display:"Rubik",system-ui,sans-serif;--mf-font-body:"Rubik",system-ui,sans-serif;--mf-font-accent:"Rubik",system-ui,sans-serif;--mf-font-mono:"Rubik",system-ui,sans-serif}
html,body {width:1920px;height:1080px;background:#CDA77C}
#root.mf-stage,#root.mf-stage.light {width:1920px;height:1080px;color:#1E1A16;background:#CDA77C}
#root.mf-stage::after {background:radial-gradient(ellipse at 50% 50%,transparent 66%,rgba(70,45,24,.11) 100%)}
#root.mf-stage::before {opacity:.08;mix-blend-mode:multiply}
.serif,.accent,.accent-word {color:#FF3E8A;font:900 1em/1 "Rubik",system-ui,sans-serif;font-style:normal}
#eyebrow {left:1145px;right:90px;top:138px;text-align:left;color:#1E1A16;font:500 26px/1.25 "Rubik",system-ui,sans-serif;letter-spacing:.1em}

#gl {width:1920px;height:1080px;left:0;top:0}
#leaders {width:1920px;height:1080px}
#callouts {display:none}
#pool {background:radial-gradient(700px 500px at 30% 50%,rgba(255,255,255,.23),transparent 75%)}
#title {left:1140px;right:80px;top:275px;text-align:left;font:900 89px/1.08 "Rubik",system-ui,sans-serif}
#subline {left:1150px;right:80px;top:850px;text-align:left;color:#1E1A16;font:600 35px/1.1 "Rubik",system-ui,sans-serif;letter-spacing:0;text-transform:none}
#stickers {position:absolute;inset:0;pointer-events:none;z-index:8}
.sticker {position:absolute;left:1180px;top:510px;width:620px;padding:24px 32px;
 background:#FFFDF7;border:8px solid #FFFDF7;outline:5px solid #FF3E8A;border-radius:16px;
 color:#1E1A16;box-shadow:0 8px 0 rgba(0,0,0,.19);font:700 45px/1.1 "Rubik",system-ui,sans-serif;opacity:0}
.sticker.hot {background:#FF3E8A;outline-color:#FFFDF7}
#grain {opacity:.03}

    </style>
  </head>
  <body>
    <div id="root" class="mf-stage" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <div id="pool"></div>
      <canvas id="gl" class="clip" width="1920" height="1080" data-start="0" data-duration="9" data-track-index="0"></canvas>
      <svg id="leaders" class="clip" viewBox="0 0 1920 1080" data-start="0" data-duration="9" data-track-index="1"></svg>
      <div id="callouts" class="clip" data-start="0" data-duration="9" data-track-index="2"></div>
      <div id="eyebrow" class="eyebrow clip" data-start="0" data-duration="9" data-track-index="3"></div>
      <h1 id="title" class="title clip" data-start="0" data-duration="9" data-track-index="4"></h1>
      <div id="subline" class="clip" data-start="0" data-duration="9" data-track-index="5"></div>
      <div id="stickers" class="clip" data-start="0" data-duration="9" data-track-index="7"></div>
      <div id="grain"></div>
    </div>

    <script id="params" type="application/json">
{
  "eyebrow": "02 · DIT ZIT ERIN",
  "title": "Vier {onderdelen}",
  "subline": "REISGIDS · KAART · ANSICHT · STICKERS",
  "model": "",
  "modelHeight": 2.1,
  "productColor": "#e4e0d8",
  "callouts": [],
  "calloutStart": 1.2,
  "orbitDegrees": 0,
  "theme": "light",
  "lang": "nl",
  "duration": 9
}
    </script>

    <script>
      // ---- HTML layer: text + GSAP timeline (the 3D layer below has its own hf-seek handler) ----
      const P = MF.params();
      document.documentElement.lang = P.lang;
      if (P.theme === "light") document.getElementById("root").classList.add("light");
      document.getElementById("eyebrow").textContent = P.eyebrow || "";
      // {word} marks the accent word (italic serif, accent colour)
      const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      document.getElementById("title").innerHTML = esc(P.title || "").replace(/\{([^}]+)\}/g, '<span class="serif accent">$1</span>');
      document.getElementById("subline").innerHTML = P.subline || "";

      const tl = MF.timeline("main", P.duration);
      MF.fit(document.getElementById("title"), 96, 60, 240);
      tl.fromTo("#eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.25);
      tl.fromTo("#title", { opacity: 0, y: 44, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.35);
      tl.fromTo("#subline", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, P.calloutStart + 1.4);

      const labels=["REISGIDS","WANDELKAART","MAM TOR-KAART","STICKERVEL"], labelTimes=[0.8,2.65,4.55,6.4];
      labels.forEach((name,i)=>{
        const el=document.createElement("div");el.className="sticker"+(i%2===0?" hot":"");el.textContent=name;
        el.style.top=(495+i%2*154)+"px";document.getElementById("stickers").appendChild(el);
        tl.fromTo(el,{opacity:0,scale:1.6,rotation:-12,y:32},
          {opacity:1,scale:1,rotation:-3,y:0,duration:.22,ease:"back.out(2.5)"},labelTimes[i]);
        if(i<labels.length-1)tl.to(el,{opacity:0,scaleY:0,transformOrigin:"50% 0%",duration:.2,ease:"power2.in"},labelTimes[i+1]-.22);
      });
      MF.ready().then(() => MF.fit(document.getElementById("title"), 96, 60, 240));
      tl.seek(0);
    </script>


    <script type="module">
      // Original MotionForge product-turntable-3d, source-native 16:9 adaptation.
      // Original Three.js and HyperFrames mf-three onSeek remain. Speaker/pedestal
      // intentionally replaced with a hinged cardboard box and four schematic items.
      import * as THREE from "three";
      import { createStage, environment, lights, shadowCatcher, onSeek, ease, seg, lerp } from "./assets/vendor/mf-three.js";
      const P=MF.params();
      const {renderer,scene,camera,render}=createStage({width:1920,height:1080,fov:30,exposure:1.04});
      environment(renderer,scene,.35);
      lights.studio(scene,{size:8,target:[-1.65,0,0]});
      shadowCatcher(scene,{size:24,opacity:.3});
      const mat=(c,opts={})=>new THREE.MeshStandardMaterial({color:c,roughness:.9,...opts});
      const kraft=mat("#CDA77C"), dark=mat("#8A6F52"),side=mat("#AF855D"),white=mat("#FFFDF7"),
        pink=mat("#FF3E8A"),yellow=mat("#FFD23F"),green=mat("#678063");
      const brick=(w,h,d,m)=>{
        const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
        o.castShadow=true;o.receiveShadow=true;return o;
      };
      const carton=new THREE.Group();carton.position.x=-1.7;scene.add(carton);
      const W=3.1,D=2.5,halfX=W/2,halfZ=D/2;
      const floor=brick(W,.12,D,dark);floor.position.y=.08;carton.add(floor);
      [-1,1].forEach(i=>{
        const xwall=brick(.11,.56,D,side);xwall.position.set(i*halfX,.42,0);carton.add(xwall);
        const zwall=brick(W,.56,.11,side);zwall.position.set(0,.42,i*halfZ);carton.add(zwall);
      });
      const hinges=[];
      ["front","back","left","right"].forEach(edge=>{
        const g=new THREE.Group(),blade=(edge==="front"||edge==="back")?
          brick(W,.035,D*.49,kraft):brick(W*.49,.035,D,kraft);
        if(edge==="front"){g.position.set(0,.76,halfZ);blade.position.z=-D*.245;}
        if(edge==="back"){g.position.set(0,.76,-halfZ);blade.position.z=D*.245;}
        if(edge==="left"){g.position.set(-halfX,.78,0);blade.position.x=W*.245;}
        if(edge==="right"){g.position.set(halfX,.78,0);blade.position.x=-W*.245;}
        g.add(blade);carton.add(g);hinges.push({g,edge});
      });
      const tissue=brick(2.5,.02,1.9,mat("#FFFDF7",{transparent:true,opacity:.85,side:THREE.DoubleSide}));
      tissue.position.y=.74;carton.add(tissue);
      const makeBook=()=>{
        const g=new THREE.Group(),body=brick(1.2,.12,.9,white),cover=brick(1.17,.025,.87,pink);
        cover.position.y=.075;g.add(body,cover);return g;
      };
      const makeMap=()=>{
        const g=new THREE.Group(),body=brick(1.3,.04,.87,white);g.add(body);
        [-.3,0,.3].forEach(x=>{const fold=brick(.021,.024,.87,dark);fold.position.set(x,.035,0);g.add(fold)});
        return g;
      };
      const makeCard=()=>{
        const g=new THREE.Group(),body=brick(1.15,.028,.8,white),hill=brick(.88,.015,.16,green);
        hill.position.set(0,.023,-.08);g.add(body,hill);return g;
      };
      const makeStickers=()=>{
        const g=new THREE.Group(),body=brick(1.1,.03,.8,white);g.add(body);
        [[-.27,-.18],[.27,-.18],[-.27,.18],[.27,.18]].forEach(([x,z],i)=>{
          const s=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.015,32),i%2?yellow:pink);
          s.position.set(x,.025,z);g.add(s);
        });return g;
      };
      const items=[makeBook(),makeMap(),makeCard(),makeStickers()],positions=[[-1.2,-1.45],[.9,-1.45],[-1.15,1.4],[.95,1.38]];
      items.forEach(o=>carton.add(o));
      function draw(t){
        // Four real hinges, each with independent rotation. Deterministic 0..-170° reveal.
        hinges.forEach(({g,edge},i)=>{
          const angle=ease.outCubic(seg(t,.55+.08*i,.35))*170*Math.PI/180;
          if(edge==="front")g.rotation.x=angle;
          else if(edge==="back")g.rotation.x=-angle;
          else if(edge==="left")g.rotation.z=angle;
          else g.rotation.z=-angle;
        });
        tissue.visible=t<1.2;
        tissue.scale.z=1-.96*ease.outCubic(seg(t,.7,.4));
        const starts=[.9,2.75,4.65,6.5];
        items.forEach((item,i)=>{
          const k=ease.outBack(seg(t,starts[i],.45),1.8);
          item.visible=k>.001;
          const move=Math.max(0,Math.min(1,k));
          item.position.set(lerp(0,positions[i][0],move),.51+1.2*move,lerp(0,positions[i][1],move));
          const squash=seg(t,starts[i]+.43,.1);
          item.scale.set(1+.08*(1-squash),1-.08*(1-squash),1);
        });
        camera.up.set(0,0,-1);
        camera.position.set(1.1,12.2,0);
        camera.lookAt(1.1,0,0);
        render();
      }
      onSeek(draw);
    </script>
  </body>
</html>
